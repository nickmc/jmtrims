# Production stack for Hatchbox (Docker Compose mode).
#
# Hatchbox assigns a loopback PORT and its managed Caddy reverse-proxies the
# public domain (with Let's Encrypt SSL) to 127.0.0.1:${PORT}. The app image is
# prebuilt in CI and pushed to GHCR; Hatchbox's build script only pulls + runs.
name: jmtrims

services:
  app:
    # Set by deploy/hatchbox-build.sh to an immutable digest
    # (ghcr.io/nickmc/jmtrims@sha256:...). Deliberately has NO default: a
    # `:-latest` fallback here silently started a stale image whenever the
    # variable failed to reach compose, which is exactly how the 2026-07-28
    # incident served days-old code through green deploys. Failing to resolve
    # is better than starting the wrong build.
    image: ${JMTRIMS_IMAGE:?set by deploy/hatchbox-build.sh}
    restart: unless-stopped
    ports:
      # Caddy reverse-proxies the public domain to 127.0.0.1:9040 on this
      # server (each app has its own loopback port: 9000/9010/9020 Rails,
      # 9030 futureaip, 9040 jmtrims). Publishing anywhere else means a 502
      # even though the container is perfectly healthy.
      #
      # No default, deliberately. The old `${PORT:-3000}` silently published
      # 3000 whenever PORT didn't arrive — and because nothing else uses 3000
      # on this server, the bind *succeeded* and the container went healthy
      # while the public site 502'd. Same failure shape as the `:-latest`
      # image default: a required value quietly substituted. Fail instead.
      - "127.0.0.1:${PORT:?set by Hatchbox; use PORT=9040 for manual runs}:3000"
    environment:
      # The SQLite DB is written here; /data is the mounted volume below, so
      # all state survives redeploys.
      JMTRIMS_DATA_DIR: /data
      # Apple iCloud CalDAV credentials for the booking calendar sync (see
      # lib/calendar.ts). Set as Hatchbox Env Vars; if left unset there,
      # these substitute empty and the app just skips the calendar sync.
      APPLE_CALDAV_USERNAME: ${APPLE_CALDAV_USERNAME:-}
      APPLE_CALDAV_APP_PASSWORD: ${APPLE_CALDAV_APP_PASSWORD:-}
    volumes:
      # Host block volume -> container /data. Override the host path per server
      # via the JMTRIMS_HOST_DATA_DIR env var in Hatchbox. The default is a
      # subdirectory of the block volume that futureaip also uses on this server.
      - ${JMTRIMS_HOST_DATA_DIR:-/mnt/volume_lon1_futureaip/jmtrims}:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
