name: Build and Deploy

# Build the production image on every push to main, push it to GHCR, then ask
# Hatchbox to pull + restart. Triggering Hatchbox from here (not from its own
# git-push auto-deploy) guarantees the new image exists before Hatchbox pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build timestamp
        id: stamp
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # No cache-from/cache-to: GHA-backed BuildKit cache was serving stale
      # layers for this multi-stage build (the final image kept the runtime
      # stage's COPY --from=builder output from an old build even though the
      # builder stage itself recompiled fresh) — every deploy silently ran
      # days-old code. Full rebuild each time costs ~1-2 extra minutes, which
      # is worth it for a build actually matching its source.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TIME=${{ steps.stamp.outputs.build_time }}

      # Best-effort: the image is already in GHCR by here, so a missing or bad
      # hook warns rather than failing the build.
      - name: Trigger Hatchbox deploy
        env:
          HOOK: ${{ secrets.HATCHBOX_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::HATCHBOX_DEPLOY_HOOK not set — image pushed to GHCR, deploy not triggered."
            exit 0
          fi
          case "$HOOK" in
            http://*|https://*) ;;
            *) echo "::warning::HATCHBOX_DEPLOY_HOOK is not an http(s) URL — skipping."; exit 0 ;;
          esac
          if curl -fsSL -X POST "$HOOK"; then
            echo "Hatchbox deploy triggered."
          else
            echo "::warning::Deploy hook POST failed (check the HATCHBOX_DEPLOY_HOOK URL). Image is in GHCR."
          fi
